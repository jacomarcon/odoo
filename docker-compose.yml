version: '3.8'

# Development docker-compose that builds the image locally
# Use this for local development and testing

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - odoo-network

  odoo:
    build: .
    # Or use pre-built image: image: your-registry/odoo-custom:latest
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      # Mount additional addons if needed
      # - ./addons:/mnt/extra-addons
    restart: unless-stopped
    networks:
      - odoo-network
    user: "odoo:odoo"

volumes:
  odoo-web-data:
  odoo-db-data:

networks:
  odoo-network:
    driver: bridge
